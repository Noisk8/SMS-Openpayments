name: sms-rafiki-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rafiki
      POSTGRES_PASSWORD: ${RAFIKI_DB_PASSWORD:?}
      POSTGRES_DB: rafiki
    volumes:
      - rafiki-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rafiki]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - rafiki-redis:/data
  rafiki-backend:
    image: ghcr.io/interledger/rafiki-backend:v2.4.5-de@sha256:50a226423f889388458f48ff6e386ee6777165a582b46bb19a36fca0140f0c90
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgresql://rafiki:${RAFIKI_DB_PASSWORD}@postgres/rafiki
      REDIS_URL: redis://redis:6379/0
      USE_TIGERBEETLE: 'false'
      ADMIN_PORT: '3001'
      CONNECTOR_PORT: '3002'
      OPEN_PAYMENTS_PORT: '3000'
      OPEN_PAYMENTS_URL: https://rafiki-backend:3000
      WALLET_ADDRESS_URL: https://rafiki-backend:3000/accounts
      ILP_ADDRESS: test.smscop
      ILP_CONNECTOR_URL: http://rafiki-backend:3002
      INSTANCE_NAME: SMS-COP-TEST
      AUTH_SERVER_GRANT_URL: http://rafiki-auth:3006
      AUTH_SERVER_INTROSPECTION_URL: http://rafiki-auth:3007
      AUTH_SERVICE_API_URL: http://rafiki-auth:3011
      ADMIN_API_SECRET: ${RAFIKI_API_SECRET:?Ejecuta npm run setup:rafiki}
      OPERATOR_TENANT_ID: ${RAFIKI_TENANT_ID:?Ejecuta npm run setup:rafiki}
      STREAM_SECRET: ${RAFIKI_STREAM_SECRET:?Ejecuta npm run setup:rafiki}
      DB_ENCRYPTION_SECRET: ${RAFIKI_DB_ENCRYPTION_SECRET:?Ejecuta npm run setup:rafiki}
      KEY_ID: sms-cop-test
      # Signed webhooks to the backend (Rafiki-Signature). The secret must match RAFIKI_WEBHOOK_SECRET.
      SIGNATURE_SECRET: ${RAFIKI_WEBHOOK_SECRET:?Ejecuta npm run setup:rafiki}
      SIGNATURE_VERSION: '1'
      WEBHOOK_URL: http://host.docker.internal:3000/webhooks/rafiki
      EXCHANGE_RATES_URL: http://host.docker.internal:3000/internal/rafiki/rates
      ENABLE_TELEMETRY: 'false'
      ENABLE_ILP_TIMING_TELEMETRY: 'false'
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:3100:3000'
      - '127.0.0.1:3101:3001'
    restart: unless-stopped
volumes:
  rafiki-postgres:
  rafiki-redis:
